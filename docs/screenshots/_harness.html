<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TV screenshot harness</title>
<style>
  html, body { margin: 0; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body.light { background: #f4f5f7; }
  body.light ha-trace-viewer { --card-background-color: #ffffff; --primary-background-color: #f4f5f7; }
  body.dark { background: #111318; }
  body.dark ha-trace-viewer { --card-background-color: #1c1e26; --primary-background-color: #111318; }
  ha-trace-viewer { display: block; width: 480px; }
</style>
</head>
<body>
<ha-trace-viewer id="card"></ha-trace-viewer>
<script>
  try { localStorage.setItem('ha-intro-dismissed-ha-trace-viewer', '1'); } catch (e) {}
</script>
<script src="../../ha-trace-viewer.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const theme = params.get('theme') === 'dark' ? 'dark' : 'light';
  document.body.className = theme;
  const now = Date.now(); const h = 3600000;

  const mk = (id, name, state, last) => ({
    entity_id: 'automation.' + id, state,
    attributes: { friendly_name: name, last_triggered: last ? new Date(now - last).toISOString() : null, mode: 'single', id: id },
    last_changed: new Date(now - 2 * h).toISOString(), last_updated: new Date(now - 2 * h).toISOString(),
  });
  const autos = [
    mk('morning_lights', 'Morning lights on sunrise', 'on', 3 * h),
    mk('night_thermostat', 'Night thermostat setback', 'on', 9 * h),
    mk('door_notify', 'Front door open notification', 'on', 0.4 * h),
    mk('vacation_presence', 'Vacation presence simulation', 'off', null),
    mk('water_leak_alert', 'Water leak alert', 'on', 26 * h),
    mk('garage_autoclose', 'Garage auto-close at night', 'on', 14 * h),
    mk('media_movie_scene', 'Movie scene on media play', 'on', 50 * h),
  ];
  const states = {};
  autos.forEach(a => { states[a.entity_id] = a; });

  const mkRuns = (aid, n, errIdx) => {
    const runs = [];
    for (let i = 0; i < n; i++) {
      const start = now - (i + 1) * 2.3 * h;
      const dur = [45, 180, 920, 60, 1400][i % 5];
      runs.push({
        run_id: aid + '-' + i, item_id: aid, state: 'stopped',
        script_execution: i === errIdx ? 'error' : 'finished',
        error: i === errIdx ? 'Template error' : undefined,
        timestamp: { start: new Date(start).toISOString(), finish: new Date(start + dur).toISOString() },
        last_step: 'action/0', trigger: 'state of binary_sensor.front_door',
      });
    }
    return runs;
  };

  const hass = {
    language: 'en',
    themes: { darkMode: theme === 'dark' },
    states,
    services: {},
    connection: { subscribeEvents: () => Promise.resolve(() => {}) },
    callWS: async (msg) => {
      const t = String(msg && msg.type || '');
      if (t === 'trace/list') {
        const aid = msg.item_id;
        const counts = { morning_lights: 4, night_thermostat: 3, door_notify: 5, vacation_presence: 0, water_leak_alert: 2, garage_autoclose: 3, media_movie_scene: 1 };
        if (aid) return mkRuns(aid, counts[aid] || 0, aid === 'door_notify' ? 1 : -1);
        let all = [];
        Object.entries(counts).forEach(([a, n]) => { all = all.concat(mkRuns(a, n, a === 'door_notify' ? 1 : -1)); });
        return all;
      }
      if (t === 'trace/get') {
        return { run_id: msg.run_id, item_id: msg.item_id, state: 'stopped', script_execution: 'finished',
          timestamp: { start: new Date(now - 2 * h).toISOString(), finish: new Date(now - 2 * h + 300).toISOString() },
          trace: {}, config: { trigger: [{ platform: 'state' }], action: [{ service: 'light.turn_on' }] }, context: {} };
      }
      return {};
    },
    callApi: async () => ({}),
    callService: async () => ({}),
  };

  const card = document.getElementById('card');
  card.setConfig({ type: 'custom:ha-trace-viewer' });
  card.hass = hass;
  setTimeout(() => { card.hass = { ...hass }; }, 400);
  const scrub = () => { try { card.shadowRoot && card.shadowRoot.querySelectorAll('#tip-banner, [class*="banner"], .donate-section').forEach(n => n.remove()); } catch (e) {} };
  setInterval(scrub, 150);
  setTimeout(() => { scrub(); document.title = 'TV-READY'; }, 1300);
})();
</script>
</body>
</html>
